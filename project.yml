name: ReveillePT
options:
  bundleIdPrefix: com.aixetech
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ReveillePT:
    type: application
    platform: iOS
    sources:
      - path: ReveillePT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aixetech.reveillept
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ReveillePT
        INFOPLIST_KEY_NSCameraUsageDescription: "ReveillePT uses the camera to track your movement during exercises. Video never leaves your device and is never saved."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  ReveillePTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReveillePTTests
    dependencies:
      - target: ReveillePT
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aixetech.reveillept.tests
schemes:
  ReveillePT:
    build:
      targets:
        ReveillePT: all
        ReveillePTTests: [test]
    test:
      targets:
        - ReveillePTTests
